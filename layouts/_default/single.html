<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }}</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
    .post-meta { color: #666; margin-bottom: 20px; }
    .post-content { line-height: 1.8; }
    .post-navigation { margin-top: 40px; border-top: 1px solid #ddd; padding-top: 20px; }
    .post-navigation ul { display: flex; justify-content: space-between; list-style: none; padding: 0; }
    .prev { margin-right: auto; }
    .next { margin-left: auto; }
    a { text-decoration: none; color: #0077cc; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <article>
    <h1>{{ .Title }}</h1>
    {{ if .Date }}
      <div class="post-meta">发布于 {{ .Date.Format "2006-01-02" }}</div>
    {{ end }}
    <div class="post-content">
      {{ .Content }}
    </div>
  </article>

  <!-- 上下篇导航 -->
  <nav class="post-navigation">
    <ul>
      {{ with .PrevInSection }}
        <li class="prev">
          <a href="{{ .Permalink }}">← {{ .Title }}</a>
        </li>
      {{ end }}
      {{ with .NextInSection }}
        <li class="next">
          <a href="{{ .Permalink }}">{{ .Title }} →</a>
        </li>
      {{ end }}
    </ul>
  </nav>
</body>
</html>
