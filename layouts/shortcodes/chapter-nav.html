<nav class="pagination-nav" aria-label="章节翻页">
  <div class="pagination justify-content-between">
    <div class="page-item-previous">
      {{ with .Page.PrevInSection }}
        <a href="{{ .Permalink }}" class="btn btn-outline-primary pagination-btn" rel="prev">← 上一章</a>
      {{ else }}
        <span class="btn btn-outline-secondary disabled pagination-btn" aria-disabled="true">← 上一章</span>
      {{ end }}
    </div>
    <div class="page-item-next">
      {{ with .Page.NextInSection }}
        <a href="{{ .Permalink }}" class="btn btn-outline-primary pagination-btn" rel="next">下一章 →</a>
      {{ else }}
        <span class="btn btn-outline-secondary disabled pagination-btn" aria-disabled="true">下一章 →</span>
      {{ end }}
    </div>
  </div>
</nav>
